# Inputs for the Catala scope UniversalCredit with start dates from 1 March
# 2026, before the 2026/27 rates apply. The coverage tests use this file to
# check that the gap before 6 April 2026 is found. The labels are the same as
# in rules/uc.inputs.toml.

[inputs.assessment_period_start]
type = "date"
min = 2026-03-01
max = 2027-04-05
controlled_by = ["claimant"]
checked_by = "dwp_records"

[inputs.earned_income]
type = "money"
min = "0.00"
max = "10000.00"
controlled_by = ["employer", "claimant"]
checked_by = "third_party_data"

[inputs.aged_25_or_over]
type = "bool"
controlled_by = ["nobody"]
checked_by = "documentary_evidence"

[inputs.has_lcw]
type = "bool"
controlled_by = ["decision_maker"]
checked_by = "assessment"

[inputs.housing_costs_element]
type = "money"
min = "0.00"
max = "3000.00"
controlled_by = ["landlord"]
checked_by = "documentary_evidence"
