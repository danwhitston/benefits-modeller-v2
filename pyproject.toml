[project]
name = "bm"
version = "0.0.0"
description = "Benefits modeller v2: Catala rules to SMT queries"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cvc5>=1.4.2",
    "policyengine-uk>=2.164.2",
    "z3-solver>=5.3.2.0",
]

[project.scripts]
bm = "bm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bm"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "hypothesis>=6.170.13",
    "pytest>=9.2.0",
]
